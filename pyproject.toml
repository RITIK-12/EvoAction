[project]
name = "evoaction"
version = "0.1.0"
description = "Self-evolving, recursively delegated agent harness for robot subtask annotation (Crusoe Recursive Agents Hackathon, Version N+1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "huggingface_hub>=0.24",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evoaction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
