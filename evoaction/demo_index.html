<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvoAction Live Demo</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1c1c1a;--muted:#6d6b64;--line:#e3e0d7;--track:#ece9e1;--accent:#3b6e5a;--onaccent:#fff;--ok:#2f8a5f;--bad:#b5482a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111110;--card:#1b1b19;--fg:#ecebe6;--muted:#a3a19a;--line:#32312d;--track:#25241f;--accent:#7fb89d;--onaccent:#0f1f18;--ok:#5cc391;--bad:#e07a5a}}
:root[data-theme="dark"]{--bg:#111110;--card:#1b1b19;--fg:#ecebe6;--muted:#a3a19a;--line:#32312d;--track:#25241f;--accent:#7fb89d;--onaccent:#0f1f18;--ok:#5cc391;--bad:#e07a5a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1280px;margin:0 auto;padding:18px 16px 20px;display:flex;flex-direction:column;gap:10px;min-height:100%}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:22px;line-height:1.2;margin:0;white-space:nowrap;letter-spacing:-.01em}
.brand{display:flex;flex-direction:column;margin-right:8px}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap}
select,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
select{flex:1 1 260px;max-width:520px}
button{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.status{font-size:12.5px;color:var(--muted)}
video{width:100%;max-height:62vh;background:#000;border-radius:10px;display:block;object-fit:contain}
.instr{font-size:13px;color:var(--muted);margin-top:-4px}
.bars{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px 4px}
.row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0}
.lbl{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lbl small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.lbl .chg{flex-basis:100%;font-size:11px;font-weight:500;color:var(--muted);line-height:1.25}
.row.best .lbl{color:var(--ok)}
.row.best .bar{box-shadow:0 0 0 2px var(--ok)}
.tag{font-size:10.5px;font-weight:700;color:var(--onaccent);background:var(--ok);border-radius:8px;padding:0 6px}
.bar{position:relative;height:30px;background:var(--track);border-radius:6px;overflow:hidden;cursor:pointer}
.seg{position:absolute;top:2px;bottom:2px;border-radius:4px;border-right:2px solid var(--card)}
.seg:hover{outline:2px solid var(--fg);z-index:1}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);left:calc(var(--t,0)*100%);pointer-events:none;z-index:3}
.pending .bar{background:repeating-linear-gradient(-45deg,var(--track),var(--track) 10px,var(--line) 10px,var(--line) 20px);background-size:28px 28px;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:28px 0}}
.axis{position:relative;height:16px;margin-left:142px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.err{color:var(--bad);font-size:11.5px;font-weight:500}
@media (max-width:640px){.row{grid-template-columns:72px minmax(0,1fr)}.axis{margin-left:82px}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><h1>EvoAction</h1><span>self-improving annotation harness · live on Crusoe</span></div>
    <select id="ep" aria-label="Episode"></select>
    <button id="run">Run N0 → N1 → N2</button>
    <span class="status" id="status"></span>
  </header>
  <video id="vid" controls muted playsinline preload="auto"></video>
  <div class="instr" id="instr"></div>
  <div class="bars">
    <div id="rows"></div>
    <div class="axis" id="axis"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const vid = $('#vid'), rowsEl = $('#rows');
const PALETTE = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#76b7b2', '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#86bcb6'];
let EP = null, rows = {}, es = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

async function init() {
  const eps = await (await fetch('/api/episodes')).json();
  const groups = {droid50: 'DROID', rest50: 'Galaxea + HomER'};
  $('#ep').innerHTML = Object.entries(groups).map(([k, g]) => `<optgroup label="${g}">` +
    eps.filter(e => e.set === k).map(e => `<option value="${e.id}">${e.id}${e.labeled_sample ? ' (labeled)' : ''} · ${e.duration_sec.toFixed(0)}s · ${esc(e.instruction.slice(0, 44))}</option>`).join('') + '</optgroup>').join('');
  $('#ep').onchange = () => load($('#ep').value);
  $('#run').onclick = run;
  await load($('#ep').value);
}

function bar(segs) {
  const d = EP.duration_sec;
  return segs.map((s, i) => {
    const l = 100 * s.start_sec / d, w = Math.max(0.3, 100 * (s.end_sec - s.start_sec) / d);
    return `<div class="seg" style="left:${l}%;width:${w}%;background:${PALETTE[i % PALETTE.length]}" title="${esc(s.subtask)} [${s.start_sec.toFixed(2)}–${s.end_sec.toFixed(2)} s]"></div>`;
  }).join('') + '<div class="playhead"></div>';
}

function addRow(id, labelHtml, cls, inner) {
  const r = document.createElement('div');
  r.className = 'row ' + (cls || '');
  r.innerHTML = `<div class="lbl">${labelHtml}</div><div class="bar">${inner || '<div class="playhead"></div>'}</div>`;
  r.querySelector('.bar').onclick = ev => { const b = ev.currentTarget.getBoundingClientRect(); vid.currentTime = (ev.clientX - b.left) / b.width * EP.duration_sec; };
  rowsEl.appendChild(r);
  rows[id] = r;
  return r;
}

async function load(id) {
  if (es) { es.close(); es = null; }
  EP = await (await fetch('/api/episode?id=' + encodeURIComponent(id))).json();
  vid.src = '/video/' + id;
  $('#instr').textContent = EP.instruction;
  const d = EP.duration_sec, step = [1, 2, 5, 10, 15, 20, 30, 60].find(s => d / s <= 8) || 60;
  let ax = ''; for (let t = 0; t <= d + 1e-6; t += step) ax += `<span style="left:${100 * t / d}%">${t}s</span>`;
  $('#axis').innerHTML = ax;
  rowsEl.innerHTML = ''; rows = {};
  addRow('GT', `GT <small>${EP.reference.length} seg</small>`, '', bar(EP.reference));
  $('#status').textContent = '';
  $('#run').disabled = false;
  tick();
}

function run() {
  if (es) es.close();
  for (const id of Object.keys(rows)) if (id !== 'GT') { rows[id].remove(); delete rows[id]; }
  $('#run').disabled = true;
  const t0 = performance.now();
  es = new EventSource(`/api/run?id=${encodeURIComponent(EP.id)}`);
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.type === 'start') {
      addRow(e.label, `${esc(e.label)} <small>labeling…</small>`, 'pending');
      $('#status').textContent = e.phase;
    } else if (e.type === 'phase') {
      $('#status').textContent = e.phase;
    } else if (e.type === 'agent') {
      $('#status').textContent = `Agent → ${e.to}: ${e.change}`;
    } else if (e.type === 'result') {
      const r = rows[e.label]; if (!r) return;
      r.className = 'row';
      r.dataset.f1 = e.snapped_f1_075;
      r.querySelector('.bar').innerHTML = bar(e.segments);
      r.querySelector('.lbl').innerHTML = `${esc(e.label)} <small>F1 ${(+e.snapped_f1_075).toFixed(2)} · ${e.n_pred} seg · ${e.wall_s}s</small>` +
        `<span class="chg">${esc(e.change)}</span>` + (e.status !== 'ok' ? `<span class="err">${esc(e.status)}</span>` : '');
      r.title = [(e.nodes || []).join(' → '), `${e.calls} live call(s)`].join('\n');
    } else if (e.type === 'error') {
      const r = rows[e.label]; if (r) { r.className = 'row'; r.querySelector('.lbl').innerHTML += `<span class="err">${esc(e.error)}</span>`; }
    } else if (e.type === 'done') {
      es.close(); es = null; $('#run').disabled = false;
      const b = rows[e.best]; if (b) { b.classList.add('best'); b.querySelector('.lbl').insertAdjacentHTML('beforeend', ' <span class="tag">best</span>'); }
      $('#status').textContent = `done in ${((performance.now() - t0) / 1000).toFixed(0)} s`;
    }
  };
  es.onerror = () => { if (es) { es.close(); es = null; } $('#run').disabled = false; $('#status').textContent = 'connection closed'; };
}

function tick() {
  if (!EP) return;
  rowsEl.style.setProperty('--t', Math.min(1, (vid.currentTime || 0) / EP.duration_sec));
}
vid.addEventListener('timeupdate', tick);
vid.addEventListener('seeked', tick);
(function loop() { if (!vid.paused) tick(); requestAnimationFrame(loop); })();
init();
</script>
</body>
</html>
